# Routing rules. The NGINX controller reads this and configures itself:
#   /api/*  -> API service      /  -> frontend service
# NOTE: the F5 NGINX Ingress Controller REJECTS rules without a host
# ("spec.rules[0].host: Required value"), so a host is mandatory here.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudnative-app
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ required "ingress.host is required (the NGINX controller rejects host-less rules)" .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: {{ .Values.api.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: {{ .Values.frontend.port }}
