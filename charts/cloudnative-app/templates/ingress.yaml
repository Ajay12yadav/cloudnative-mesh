# Routing rules. The NGINX controller reads this and configures itself:
#   /api/*  -> API service      /  -> frontend service
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudnative-app
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: {{ .Values.api.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: {{ .Values.frontend.port }}
