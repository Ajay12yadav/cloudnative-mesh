# Defaults. Account-specific values (ECR URLs, DB/Redis endpoints, role ARN)
# live in values-dev.yaml, generated by scripts/gen-values.sh

api:
  replicaCount: 2
  image:
    repository: ""
    tag: v1
  port: 8000
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 256Mi }

frontend:
  replicaCount: 2
  image:
    repository: ""
    tag: v1
  port: 8080
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits:   { cpu: 200m, memory: 64Mi }

data:
  dbHost: ""
  dbPort: "5432"
  dbName: appdb
  dbSecretArn: ""
  redisHost: ""
  redisPort: "6379"
  region: ap-south-1

irsa:
  apiRoleArn: ""

ingress:
  className: nginx
