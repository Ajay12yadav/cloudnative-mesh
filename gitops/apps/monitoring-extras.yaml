# OUR Grafana dashboard and alert rules (plain manifests in k8s/monitoring/extras).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-extras
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Ajay12yadav/cloudnative-mesh.git
    targetRevision: main
    path: k8s/monitoring/extras
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true   # PrometheusRule CRD may not exist yet on the first attempt
    retry:
      limit: 20
      backoff: { duration: 20s, factor: 2, maxDuration: 5m }
