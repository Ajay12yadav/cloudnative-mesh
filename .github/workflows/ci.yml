name: ci

# Checks that run on every pull request. They have NO access to AWS.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Format check (warning only until you run "terraform fmt -recursive" once)
        run: terraform fmt -check -recursive -diff
        continue-on-error: true
      - name: Validate every root module
        run: |
          set -e
          for dir in bootstrap envs/shared envs/dev; do
            echo "::group::validate $dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

  kubernetes:
    name: Helm lint and manifest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Helm lint and render
        run: |
          set -e
          SET="api.image.repository=example.invalid/api,api.image.tag=ci,frontend.image.repository=example.invalid/frontend,frontend.image.tag=ci"
          helm lint charts/cloudnative-app --set "$SET"
          helm template app charts/cloudnative-app --set "$SET" > /tmp/rendered.yaml
          wc -l /tmp/rendered.yaml
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz -C /tmp
      - name: Validate manifests against Kubernetes schemas
        run: |
          # CRDs (ServiceMonitor, PrometheusRule, Argo Application) have no built-in schema: skip those
          /tmp/kubeconform -strict -ignore-missing-schemas -summary \
            /tmp/rendered.yaml k8s/platform/storageclass-gp3.yaml k8s/monitoring/extras/*.yaml
      - name: YAML syntax of values and GitOps files
        run: |
          python3 - <<'PY'
          import glob, yaml
          files = glob.glob("gitops/**/*.yaml", recursive=True) + glob.glob("k8s/**/*.yaml", recursive=True) \
                  + ["charts/cloudnative-app/values.yaml", "charts/cloudnative-app/Chart.yaml"]
          for f in files:
              list(yaml.safe_load_all(open(f)))
              print("ok", f)
          PY
      - name: Shell script syntax
        run: for f in scripts/*.sh; do bash -n "$f" && echo "ok $f"; done

  api-tests:
    name: API unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/api/requirements-dev.txt
      - run: pip install -r app/api/requirements-dev.txt
      - run: python -m pytest app/api/tests -v

  images:
    name: Build images and scan (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          docker build --platform linux/amd64 -t cnm-api:ci app/api
          docker build --platform linux/amd64 -t cnm-frontend:ci app/frontend
      - name: Vulnerability scan with Trivy (report only; does not fail the build)
        run: |
          for img in cnm-api:ci cnm-frontend:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest \
              image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 "$img"
          done
