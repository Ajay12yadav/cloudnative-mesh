name: oidc-debug

# TEMPORARY helper: prints the identity claims GitHub gives to AWS.
# It does not touch AWS and does not print the token itself.
on: workflow_dispatch

permissions:
  id-token: write
  contents: read

jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - name: Print the OIDC claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["value"])')
          python3 - "$TOKEN" <<'PY'
          import sys, json, base64
          payload = sys.argv[1].split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for key in ("iss", "aud", "sub", "repository", "repository_owner", "ref", "event_name"):
              print(f"{key}: {claims.get(key)}")
          PY
